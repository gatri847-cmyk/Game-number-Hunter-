<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Hunter Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 24px;
        }

        .difficulty-group {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .diff-btn {
            background: #334155;
            color: #cbd5e1;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .diff-btn.active {
            background: #6366f1;
            color: #fff;
            box-shadow: 0 0 12px rgba(99, 102, 241, 0.5);
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: rgba(15, 23, 42, 0.6);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        .stat-value {
            font-weight: bold;
            color: #38bdf8;
        }

        .input-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="number"] {
            flex: 1;
            background: rgba(15, 23, 42, 0.8);
            border: 2px solid #475569;
            color: #fff;
            padding: 12px;
            border-radius: 10px;
            font-size: 1.1rem;
            text-align: center;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="number"]:focus {
            border-color: #6366f1;
        }

        button.action-btn {
            background: linear-gradient(90deg, #6366f1, #4f46e5);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.1s ease, box-shadow 0.2s ease;
        }

        button.action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
        }

        .feedback-message {
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 20px;
            border-radius: 10px;
            padding: 8px;
        }

        .hint-high { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }
        .hint-low { background: rgba(59, 130, 246, 0.2); color: #93c5fd; }
        .hint-win { background: rgba(34, 197, 94, 0.2); color: #86efac; }

        .history-list {
            max-height: 120px;
            overflow-y: auto;
            text-align: left;
            background: rgba(15, 23, 42, 0.4);
            border-radius: 10px;
            padding: 10px;
        }

        .history-title {
            font-size: 0.8rem;
            color: #64748b;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            padding: 4px 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>

<div class="game-card">
    <h1>🎯 Number Hunter</h1>
    <p class="subtitle">Temukan angka rahasia sebelum percobaannmu habis!</p>

    <div class="difficulty-group">
        <button class="diff-btn active" onclick="setDifficulty('easy')">Mudah (1-50)</button>
        <button class="diff-btn" onclick="setDifficulty('medium')">Sedang (1-100)</button>
        <button class="diff-btn" onclick="setDifficulty('hard')">Sulit (1-500)</button>
    </div>

    <div class="stats-bar">
        <div>Percobaan: <span id="attempts" class="stat-value">0</span></div>
        <div>Skor Terbaik: <span id="high-score" class="stat-value">-</span></div>
    </div>

    <div class="input-box">
        <input type="number" id="guess-input" placeholder="Masukkan angka..." onkeydown="if(event.key==='Enter') makeGuess()">
        <button class="action-btn" id="submit-btn" onclick="makeGuess()">Tebak</button>
    </div>

    <div id="feedback" class="feedback-message">Pilih rentang & mulailah menebak!</div>

    <div class="history-list">
        <div class="history-title">Riwayat Tebakan</div>
        <div id="history-container"></div>
    </div>
</div>

<script>
    let maxRange = 50;
    let targetNumber = 0;
    let attempts = 0;
    let gameOver = false;

    function initGame() {
        targetNumber = Math.floor(Math.random() * maxRange) + 1;
        attempts = 0;
        gameOver = false;
        document.getElementById('attempts').innerText = attempts;
        document.getElementById('feedback').className = 'feedback-message';
        document.getElementById('feedback').innerText = `Tebak angka antara 1 sampai ${maxRange}!`;
        document.getElementById('history-container').innerHTML = '';
        document.getElementById('guess-input').value = '';
        document.getElementById('guess-input').disabled = false;
        document.getElementById('submit-btn').innerText = 'Tebak';
    }

    function setDifficulty(level) {
        document.querySelectorAll('.diff-btn').forEach(btn => btn.classList.remove('active'));
        if (level === 'easy') {
            maxRange = 50;
            event.target.classList.add('active');
        } else if (level === 'medium') {
            maxRange = 100;
            event.target.classList.add('active');
        } else if (level === 'hard') {
            maxRange = 500;
            event.target.classList.add('active');
        }
        initGame();
    }

    function makeGuess() {
        if (gameOver) {
            initGame();
            return;
        }

        const inputEl = document.getElementById('guess-input');
        const guess = parseInt(inputEl.value);

        if (isNaN(guess) || guess < 1 || guess > maxRange) {
            alert(`Harap masukkan angka valid antara 1 dan ${maxRange}.`);
            return;
        }

        attempts++;
        document.getElementById('attempts').innerText = attempts;

        const feedbackEl = document.getElementById('feedback');
        let hint = '';

        if (guess === targetNumber) {
            feedbackEl.className = 'feedback-message hint-win';
            feedbackEl.innerText = `🎉 Tepat sekali! Angkanya adalah ${targetNumber}.`;
            gameOver = true;
            document.getElementById('submit-btn').innerText = 'Main Lagi';
            document.getElementById('guess-input').disabled = true;
            updateHighScore();
            addHistory(guess, 'MENANG');
            return;
        } else if (guess > targetNumber) {
            feedbackEl.className = 'feedback-message hint-high';
            hint = 'Terlalu Tinggi! 🔥';
            addHistory(guess, 'Terlalu Tinggi');
        } else {
            feedbackEl.className = 'feedback-message hint-low';
            hint = 'Terlalu Rendah! ❄️';
            addHistory(guess, 'Terlalu Rendah');
        }

        feedbackEl.innerText = hint;
        inputEl.value = '';
        inputEl.focus();
    }

    function addHistory(guess, result) {
        const container = document.getElementById('history-container');
        const item = document.createElement('div');
        item.className = 'history-item';
        item.innerHTML = `<span>Tebakan: <strong>${guess}</strong></span><span>${result}</span>`;
        container.insertBefore(item, container.firstChild);
    }

    function updateHighScore() {
        const key = `number_hunter_hs_${maxRange}`;
        const currentHS = localStorage.getItem(key);
        if (!currentHS || attempts < parseInt(currentHS)) {
            localStorage.setItem(key, attempts);
            document.getElementById('high-score').innerText = `${attempts}x percobaan`;
        }
    }

    initGame();
</script>
</body>
</html>
